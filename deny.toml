# cargo-deny policy (ADR-0002, ADR-0004): permissive licences only, no unknown sources.
# Run with: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained (not a vulnerability). It is a build-time
    # macro reached only through Tauri's Linux GTK stack (gtk-rs 0.18 / glib-macros).
    # Remove this entry when Tauri moves to a gtk-rs release without it.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via tauri -> gtk 0.18 -> glib-macros; no maintained alternative in Tauri 2.12" },
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6 (2026-10-16);
    # the zbus 5 line still works and is not a vulnerability. Reached only on Linux,
    # through tauri-plugin-single-instance 2.5 and zbus-secret-service-keyring-store 1
    # (both on zbus 5). Remove these entries when both move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; Linux-only via tauri-plugin-single-instance and the Secret Service keyring store -> zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; Linux-only via tauri-plugin-single-instance and the Secret Service keyring store -> zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; Linux-only via tauri-plugin-single-instance and the Secret Service keyring store -> zbus 5" },
    # chrono is unmaintained (not a vulnerability). imap-types and imap-codec need
    # it, in their latest releases too (2.0.0-alpha.8 / alpha.10), and our one use
    # (a SEARCH date, regards-imap) is to hand them its type. Remove this entry
    # when they move to another date library.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; required by imap-types and imap-codec, which have no release without it" },
    # The two below have a fix, but one younger than our two-week rule for new
    # versions; the owner chose on 2026-11-24 to wait, as Regards is not exposed.
    # url: only `Url::origin()` overflows, on nested `blob:` URLs; neither Regards
    # nor Tauri or wry calls it. From 2026-12-04: `cargo update -p url` (>= 2.5.9)
    # and remove this entry.
    { id = "RUSTSEC-2026-0592", reason = "Url::origin() is not called; fix url 2.5.9 is from 2026-11-20, take it from 2026-12-04" },
    # cookie: only programs that fork and then write private cookies; Regards
    # neither forks nor uses private cookies (cookie comes with Tauri and wry).
    # From 2026-12-07: `cargo update -p cookie` (>= 0.18.3) and remove this entry.
    { id = "RUSTSEC-2026-0594", reason = "no fork, no private cookies; fix cookie 0.18.3 is from 2026-11-23, take it from 2026-12-07" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
