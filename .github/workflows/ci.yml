name: CI

# Actions are pinned to a commit, with the version as a comment: a moving tag
# (@v4, @stable) can change under us. Bump them like any dependency, to a
# release at least two weeks old.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: do not leave the token in its config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable branch, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux system libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  live-imap:
    name: Live IMAP (Dovecot)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Dovecot 2.4.5, as tested in docs/research/07-imap-library-spike.md.
      DOVECOT_IMAGE: dovecot/dovecot@sha256:43c14def08a57f25107593cbcf64a0a6fbae84a7b9de7aa038513c9b21e91914
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: do not leave the token in its config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable branch, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Throwaway CA and Dovecot
        run: |
          mkdir -p "$RUNNER_TEMP/tls" && cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Regards Test CA" -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\n" > leaf.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile leaf.ext -out server.pem
          chmod 644 server.key
          docker run -d --name dovecot -e USER_PASSWORD=pass -p 127.0.0.1:31993:31993 \
            -v "$PWD/server.pem:/etc/dovecot/ssl/tls.crt:ro" -v "$PWD/server.key:/etc/dovecot/ssl/tls.key:ro" \
            "$DOVECOT_IMAGE"
          for i in $(seq 30); do
            if openssl s_client -connect 127.0.0.1:31993 -CAfile ca.pem -verify_return_error </dev/null 2>/dev/null | grep -q "OK"; then exit 0; fi
            sleep 1
          done
          docker logs dovecot
          exit 1
      - name: Live tests
        env:
          REGARDS_TEST_IMAP: localhost:31993
          REGARDS_TEST_IMAP_CA: ${{ runner.temp }}/tls/ca.pem
        run: cargo test -p regards-imap -p regards-daemon -- --ignored live_

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: do not leave the token in its config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in the web packages
        run: npm audit --audit-level=moderate
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test

  deny:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: do not leave the token in its config.
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The installers are otherwise only built for a version tag (release.yml),
  # so a change that breaks them would show on release day. A pull request
  # that touches what goes into them builds them here, as a release does, and
  # checks that the update files are there. Nothing is kept or published.
  packaging:
    name: Packaging changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.look.outputs.changed }}
    steps:
      - name: Look at the files this pull request changes
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          wanted='^(apps/desktop/src-tauri/(tauri\.[a-z.]*json|Cargo\.toml|build\.rs|windows/|capabilities/|icons/)|apps/desktop/scripts/|apps/desktop/package(-lock)?\.json|\.github/workflows/(ci|release)\.yml|Cargo\.lock|about\.toml)'
          if grep -qE "$wanted" <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            grep -E "$wanted" <<<"$files"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: packaging
    if: needs.packaging.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # One Mac is enough here: the release builds Apple silicon and Intel.
          - name: macOS
            os: macos-latest
          # As the release: the oldest supported Ubuntu.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Warnings are the Rust jobs' business; here they would only rebuild everything.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: do not leave the token in its config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable branch, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bundle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux system libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: cargo-about, for the licence list (Support › Licences)
        run: cargo install cargo-about --version =0.9.2 --locked --features cli
      # As release.yml builds them, update files included, but signed with a
      # key made here and thrown away: the real one is only for releases.
      - name: Build the bundles
        working-directory: apps/desktop
        shell: bash
        run: |
          npx tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key" > /dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/throwaway.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npm run release -- --config src-tauri/tauri.updater.json
      - name: The installers and their update files are there
        shell: bash
        run: |
          cd target/release/bundle
          ls -l */ | grep -v '^total'
          shopt -s nullglob
          need() { local found=($1); [ ${#found[@]} -gt 0 ] || { echo "::error::missing: $1"; missing=1; }; }
          case "$RUNNER_OS" in
            Windows) need "nsis/*-setup.exe"; need "nsis/*-setup.exe.sig" ;;
            macOS) need "dmg/*.dmg"; need "macos/*.app.tar.gz"; need "macos/*.app.tar.gz.sig" ;;
            Linux) need "deb/*.deb"; need "rpm/*.rpm"; need "appimage/*.AppImage"; need "appimage/*.AppImage.sig" ;;
          esac
          exit "${missing:-0}"
      # Without even this signature, macOS says a downloaded app is damaged.
      - name: The Mac app is signed, ad hoc
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/Regards.app
          codesign --display --verbose=2 target/release/bundle/macos/Regards.app 2>&1 | grep -i "Signature=adhoc"
